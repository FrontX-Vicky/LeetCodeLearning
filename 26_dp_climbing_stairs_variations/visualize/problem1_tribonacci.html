<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LC #1137 N-th Tribonacci Number</title>
<style>
:root {
    --bg-color: #0d1117; --text-color: #c9d1d9; --accent-color: #58a6ff;
    --success-color: #3fb950; --danger-color: #f85149; --warning-color: #d29922;
    --card-bg: #161b22; --border-color: #30363d; --purple: #bc8cff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background-color:var(--bg-color);color:var(--text-color);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
.header{background:var(--card-bg);border-bottom:1px solid var(--border-color);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:16px}
.header-left h1{font-size:15px;font-weight:600;color:#f0f6fc;margin:0}
.header-left p{font-size:11px;color:#8b949e;margin-top:3px}
.prob-nav{background:#21262d;border:1px solid var(--border-color);color:var(--text-color);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer;outline:none;}
.controls { display: flex; gap: 8px; align-items:center;}
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border-color); background: #21262d; color: var(--text-color); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.btn:hover:not(:disabled) { border-color: var(--accent-color); color: var(--accent-color); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: #238636; border-color: #2ea043; color: white; }
.btn.primary:hover:not(:disabled) { background: #2ea043; }

/* MAIN LAYOUT */
.main-wrapper { display: flex; flex-direction: column; flex: 1; padding: 10px; gap: 4px; overflow: hidden; }
.top-panels { display: flex; flex: 3; min-height: 0; gap: 4px; }
.bottom-panel { flex: 1; min-height: 100px; background: #010409; border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;}

/* LEFT PANEL */
.left-panel { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
.panel-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #8b949e; padding: 10px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }

.inputs-container { background: #0d1117; border-bottom: 1px solid var(--border-color); flex-shrink: 0;}
.vars-container { display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; justify-content: space-between; background: #161b22;}
.var-box { background: #21262d; border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; text-align: center; flex: 1; min-width: 50px;}
.var-title { font-size: 10px; color: #8b949e; text-transform: uppercase; margin-bottom: 4px; }
.var-val { font-size: 14px; font-weight: bold; color: var(--accent-color); font-family: monospace; word-break: break-all;}

.code-block { flex: 1; overflow-y: auto; padding: 10px 0; font-family: 'Consolas', monospace; font-size: 12px; line-height: 1.6; background: #1e1e1e; min-height: 150px;}
.code-line { display: flex; padding: 0 10px 0 0; border-left: 3px solid transparent; transition: all 0.2s;}
.code-line.active { background-color: rgba(88, 166, 255, 0.15); border-left-color: var(--accent-color); }
.ln { width: 30px; text-align: right; color: #858585; padding-right: 10px; user-select: none; flex-shrink: 0;}
.lt { white-space: pre; color: #d4d4d4; }
.k-kw { color: #569cd6; } .k-fn { color: #dcdcaa; } .k-str { color: #ce9178; } .k-num { color: #b5cea8; }

/* CENTER PANEL */
.center-panel { flex: 2; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
.svg-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #0d1117; position: relative; padding: 20px; overflow: auto;}

/* Array DP Visualization */
.dp-array { display: flex; gap: 8px; align-items: flex-end; justify-content: center; min-width: max-content; }
.dp-cell-container { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dp-index { font-size: 11px; color: #8b949e; font-family: monospace; }
.dp-box { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 2px solid var(--border-color); background: #21262d; font-family: monospace; font-size: 16px; font-weight: bold; transition: all 0.3s; position: relative; }
.dp-box.known { border-color: var(--success-color); background: rgba(63, 185, 80, 0.1); color: var(--success-color); }
.dp-box.current { border-color: var(--accent-color); background: rgba(88, 166, 255, 0.1); color: var(--accent-color); transform: translateY(-5px); box-shadow: 0 4px 12px rgba(88, 166, 255, 0.2); }
.dp-box.prev1 { border-color: var(--success-color); background: rgba(63, 185, 80, 0.1); color: var(--success-color); }
.dp-box.prev2 { border-color: var(--purple); background: rgba(188, 140, 255, 0.1); color: var(--purple); }
.dp-box.prev3 { border-color: var(--warning-color); background: rgba(210, 153, 34, 0.1); color: var(--warning-color); }
.dp-label { font-size: 10px; font-weight: bold; color: var(--border-color); margin-top: 4px; transition: color 0.3s;}
.dp-label.t0-lbl { color: var(--warning-color); }
.dp-label.t1-lbl { color: var(--purple); }
.dp-label.t2-lbl { color: var(--success-color); }

/* SVG Arrows */
.arrows-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.dp-arrow { fill: none; stroke-width: 2; stroke-dasharray: 4; opacity: 0; transition: opacity 0.3s; }
.dp-arrow.show { opacity: 1; animation: dashMove 1s linear infinite; }
@keyframes dashMove { to { stroke-dashoffset: -8; } }

/* LOGS */
.log-container { flex: 1; padding: 12px; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.5; }
.log-entry { margin-bottom: 6px; padding: 6px 10px; border-left: 3px solid var(--border-color); background: #0d1117; border-radius: 0 4px 4px 0; animation: fadeLeft 0.3s ease; }
.log-hl { color: var(--accent-color); font-weight: bold; border-left-color: var(--accent-color); background: rgba(88, 166, 255, 0.05); }
.log-success { color: var(--success-color); font-weight: bold; border-left-color: var(--success-color); background: rgba(63, 185, 80, 0.05); }
.log-purple { color: var(--purple); font-weight: bold; border-left-color: var(--purple); background: rgba(188, 140, 255, 0.05); }
.log-danger { color: var(--danger-color); font-weight: bold; border-left-color: var(--danger-color); background: rgba(248, 81, 73, 0.05); }

@keyframes fadeLeft { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

/* RESIZERS */
.resizer-v { width: 6px; cursor: col-resize; background: transparent; transition: background 0.2s; z-index: 10; margin: 0 -1px;}
.resizer-v:hover, .resizer-v.dragging { background: var(--accent-color); }
.resizer-h { height: 6px; cursor: row-resize; background: transparent; transition: background 0.2s; z-index: 10; margin: -1px 0;}
.resizer-h:hover, .resizer-h.dragging { background: var(--accent-color); }
</style>
</head>

<div class="header">

<div class="code-line" id="line-8"><div class="ln">8</div><div class="lt">    <span class="k-kw">for</span> _ <span class="k-kw">in</span> <span class="k-fn">range</span>(<span class="k-num">3</span>, n + <span class="k-num">1</span>):</div></div>

let curStep = -1;
let currentMode = 'tc1';
let states = trib_tc1;
let n = 5;

function loadTestCase() {
    currentMode = document.getElementById('tc-select').value;
    states = currentMode === 'tc1' ? trib_tc1 : (currentMode === 'tc2' ? trib_tc2 : trib_tc3);
    n = states[0].n;
    document.getElementById('in-n').innerText = n;
    
    // Generate DP array UI
    const arr = document.getElementById('dp-array');
    arr.innerHTML = '';
    for(let i=0; i<=n; i++) {
        arr.innerHTML += `
            <div class="dp-cell-container" id="cell-c-${i}">
                <div class="dp-index">i=${i}</div>
                <div class="dp-box" id="cell-${i}">?</div>
                <div class="dp-label" id="lbl-${i}">-</div>
            </div>
        `;
    }
    reset();
}

function updateUI() {
    const s = states[curStep];
    if (!s) return;
    
    // Variables
    document.getElementById('var-t0').innerText = s.t0 !== undefined ? s.t0 : '-';
    document.getElementById('var-t1').innerText = s.t1 !== undefined ? s.t1 : '-';
    document.getElementById('var-t2').innerText = s.t2 !== undefined ? s.t2 : '-';
    document.getElementById('var-i').innerText = s.i !== undefined ? s.i : '-';
    
    // Highlight Code
    document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
    if (s.line && document.getElementById(`line-${s.line}`)) {
        document.getElementById(`line-${s.line}`).classList.add('active');
    }
    
    if (s.dp) {
        for(let i=0; i<=n; i++) {
            const box = document.getElementById(`cell-${i}`);
            const lbl = document.getElementById(`lbl-${i}`);
            box.className = 'dp-box';
            lbl.className = 'dp-label';
            lbl.innerText = '-';
            
            const val = s.dp[i];
            if (val !== 0 || i === 0) {
                // Because trib(0) is 0, we can just say if i <= 2 it's known initially, else check > 0.
                if (i <= 2 || val > 0) {
                    box.innerText = val;
                    box.classList.add('known');
                } else {
                    box.innerText = '?';
                }
            } else {
                box.innerText = '?';
            }
        }
    }
    
    // Apply current state
    document.getElementById('arrow-t0').classList.remove('show');
    document.getElementById('arrow-t1').classList.remove('show');
    document.getElementById('arrow-t2').classList.remove('show');
    
    if (s.line === 15 || s.line === 19) {
        let i = s.line === 15 ? 3 : n + 1;
        
        let idxT2 = i - 1;
        let idxT1 = i - 2;
        let idxT0 = i - 3;
        
        document.getElementById(`cell-${idxT2}`).classList.add('prev1');
        document.getElementById(`lbl-${idxT2}`).innerText = 't2';
        document.getElementById(`lbl-${idxT2}`).classList.add('t2-lbl');
        
        document.getElementById(`cell-${idxT1}`).classList.add('prev2');
        document.getElementById(`lbl-${idxT1}`).innerText = 't1';
        document.getElementById(`lbl-${idxT1}`).classList.add('t1-lbl');
        
        document.getElementById(`cell-${idxT0}`).classList.add('prev3');
        document.getElementById(`lbl-${idxT0}`).innerText = 't0';
        document.getElementById(`lbl-${idxT0}`).classList.add('t0-lbl');
    }
    
    if (s.line === 16 || s.line === 17) {
        let i = s.i;
        document.getElementById(`cell-${i}`).classList.add('current');
        
        let idxT2 = i - 1;
        let idxT1 = i - 2;
        let idxT0 = i - 3;
        
        document.getElementById(`cell-${idxT0}`).classList.add('prev3');
        document.getElementById(`lbl-${idxT0}`).innerText = 't0';
        document.getElementById(`lbl-${idxT0}`).classList.add('t0-lbl');
        
        document.getElementById(`cell-${idxT1}`).classList.add('prev2');
        document.getElementById(`lbl-${idxT1}`).innerText = 't1';
        document.getElementById(`lbl-${idxT1}`).classList.add('t1-lbl');
        
        document.getElementById(`cell-${idxT2}`).classList.add('prev1');
        document.getElementById(`lbl-${idxT2}`).innerText = 't2';
        document.getElementById(`lbl-${idxT2}`).classList.add('t2-lbl');
        
        if (s.line === 17) {
            drawArrow(idxT0, i, 'arrow-t0');
            drawArrow(idxT1, i, 'arrow-t1');
            drawArrow(idxT2, i, 'arrow-t2');
            document.getElementById('arrow-t0').classList.add('show');
            document.getElementById('arrow-t1').classList.add('show');
            document.getElementById('arrow-t2').classList.add('show');
        }
    }
    
    // Logs
    const logContainer = document.getElementById('logs');
    const logEl = document.createElement('div');
    logEl.className = `log-entry ${s.log.c}`;
    logEl.innerHTML = `<span style="color:#8b949e">[Step ${curStep+1}]</span> ${s.log.t}`;
    logContainer.appendChild(logEl);
    logContainer.scrollTop = logContainer.scrollHeight;
    
    // Buttons
    document.getElementById('btn-prev').disabled = curStep === 0;
    document.getElementById('btn-next').disabled = curStep === states.length - 1;
}

function drawArrow(fromIdx, toIdx, arrowId) {
    const fromEl = document.getElementById(`cell-${fromIdx}`);
    const toEl = document.getElementById(`cell-${toIdx}`);
    const svg = document.getElementById('arrows-layer');
    if(!fromEl || !toEl || !svg) return;
    
    const svgRect = svg.getBoundingClientRect();
    const fRect = fromEl.getBoundingClientRect();
    const tRect = toEl.getBoundingClientRect();
    
    const x1 = fRect.left + fRect.width/2 - svgRect.left;
    const y1 = fRect.top - svgRect.top;
    const x2 = tRect.left + tRect.width/2 - svgRect.left;
    const y2 = tRect.top - svgRect.top;
    
    const midX = (x1 + x2)/2;
    // Arch up, farther back means higher arch so they don't perfectly overlap
    const archHeight = 30 + (toIdx - fromIdx) * 10;
    const midY = Math.min(y1, y2) - archHeight; 
    
    const d = `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`;
    document.getElementById(arrowId).setAttribute('d', d);
}

window.addEventListener('resize', () => {
    if (curStep >= 0) {
        const s = states[curStep];
        if (s.line === 17) {
            drawArrow(s.i - 3, s.i, 'arrow-t0');
            drawArrow(s.i - 2, s.i, 'arrow-t1');
            drawArrow(s.i - 1, s.i, 'arrow-t2');
        }
    }
});

function step(dir) {
    if (dir === 1 && curStep < states.length - 1) {
        curStep++;
        updateUI();
    } else if (dir === -1 && curStep > 0) {
        document.getElementById('logs').innerHTML = '';
        const target = curStep - 1;
        curStep = -1;
        while (curStep < target) {
            curStep++;
            updateUI();
        }
    }
}

function reset() {
    curStep = -1;
    document.getElementById('logs').innerHTML = '';
    document.getElementById('var-t0').innerText = '-';
    document.getElementById('var-t1').innerText = '-';
    document.getElementById('var-t2').innerText = '-';
    document.getElementById('var-i').innerText = '-';
    document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
    document.getElementById('arrow-t0').classList.remove('show');
    document.getElementById('arrow-t1').classList.remove('show');
    document.getElementById('arrow-t2').classList.remove('show');
    
    for(let i=0; i<=n; i++) {
        document.getElementById(`cell-${i}`).className = 'dp-box';
        document.getElementById(`cell-${i}`).innerText = '?';
        document.getElementById(`lbl-${i}`).className = 'dp-label';
        document.getElementById(`lbl-${i}`).innerText = '-';
    }
    
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = false;
}

loadTestCase();

const resizerV = document.getElementById('resizer-v');
const leftPanel = document.getElementById('left-panel');
const resizerH = document.getElementById('resizer-h');
const topPanels = document.getElementById('top-panels');
let isDraggingV = false;
let isDraggingH = false;
let startX, startY, startWidth, startHeight;

resizerV.addEventListener('mousedown', (e) => {
    isDraggingV = true; startX = e.clientX; startWidth = leftPanel.offsetWidth;
    document.body.style.cursor = 'col-resize'; resizerV.classList.add('dragging');
});
resizerH.addEventListener('mousedown', (e) => {
    isDraggingH = true; startY = e.clientY; startHeight = topPanels.offsetHeight;
    document.body.style.cursor = 'row-resize'; resizerH.classList.add('dragging');
});
document.addEventListener('mousemove', (e) => {
    if (isDraggingV) {
        leftPanel.style.flex = 'none';
        leftPanel.style.width = Math.max(150, startWidth + (e.clientX - startX)) + 'px';
    }
    if (isDraggingH) {
        topPanels.style.flex = 'none';
        topPanels.style.height = Math.max(100, startHeight + (e.clientY - startY)) + 'px';
    }
});
document.addEventListener('mouseup', () => {
    if (isDraggingV) { isDraggingV = false; document.body.style.cursor = 'default'; resizerV.classList.remove('dragging'); window.dispatchEvent(new Event('resize')); }
    if (isDraggingH) { isDraggingH = false; document.body.style.cursor = 'default'; resizerH.classList.remove('dragging'); window.dispatchEvent(new Event('resize')); }
});
</script>
