<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Min in BST — Visualizer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--muted:#8b949e;--text:#c9d1d9;--head:#f0f6fc;--blue:#58a6ff;--orange:#d29922;--green:#3fb950;--purple:#bc8cff;--red:#f85149}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.header-left h1{font-size:15px;font-weight:600;color:var(--head)}.header-left p{font-size:11px;color:var(--muted);margin-top:2px}
.ex-btns{display:flex;gap:6px;flex-shrink:0}
.ex-btn{padding:5px 13px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.ex-btn:hover{border-color:var(--blue);color:var(--blue)}.ex-btn.active{border-color:var(--blue);background:#1c3458;color:var(--blue);font-weight:600}
.kbd-hint{font-size:11px;color:#484f58;flex-shrink:0;margin-left:auto;white-space:nowrap}.kbd-hint kbd{background:#21262d;border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:10px;color:var(--muted)}
.main{display:flex;flex:1;overflow:hidden;min-height:0}
.code-panel{width:28%;min-width:120px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
.resizer{width:5px;flex-shrink:0;cursor:col-resize;background:var(--border)}.resizer:hover{background:var(--blue)}
.code-block{flex:1;overflow-y:auto;padding:6px 0;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:11.5px;line-height:1.65}
.code-line{display:flex;align-items:center;padding:0 10px 0 0;min-height:19px;border-left:2px solid transparent;transition:background .18s}
.code-line.hl-orange{background:rgba(210,153,34,.13);border-left-color:var(--orange)}.code-line.hl-green{background:rgba(63,185,80,.13);border-left-color:var(--green)}
.ln{width:26px;text-align:right;flex-shrink:0;color:#484f58;font-size:10px;padding-right:10px;user-select:none}
.lt{white-space:pre}.kw{color:#ff7b72}.fn{color:#d2a8ff}.bi{color:#79c0ff}.cm{color:#484f58;font-style:italic}.nm{color:#f2cc60}
.io-bar{flex-shrink:0;padding:5px 10px;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:10.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-height:26px;background:#0a0d13}
.io-bar.input{border-bottom:1px solid var(--border)}.io-bar.output{border-top:1px solid var(--border)}
.io-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.io-bar.input .io-lbl{color:#58a6ff55}.io-bar.output .io-lbl{color:var(--green)}
.io-key{color:var(--purple)}.io-sep{color:#484f58}.io-v{color:var(--text)}.io-na{color:#484f58;font-style:italic}
.visual-panel{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 18px;gap:12px;overflow:hidden;border-right:1px solid var(--border)}
.panel-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.hint-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.5;margin-top:8px}
.state-panel{width:240px;flex-shrink:0;display:flex;flex-direction:column;padding:12px;gap:10px;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:11px 13px;flex-shrink:0}
.card-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.var-list{display:flex;flex-direction:column;gap:5px}
.var-row{display:flex;align-items:center;gap:8px;font-family:monospace;font-size:12px}
.var-name{color:var(--purple);font-weight:600;min-width:55px}.var-eq{color:#484f58}.var-val{color:var(--text);flex:1}
.log-list{display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.card-grow{flex:1;min-height:0;display:flex;flex-direction:column}.card-grow .log-list{flex:1;min-height:0}
.log-entry{font-size:11px;line-height:1.4;color:#484f58;padding:4px 8px;background:var(--bg);border-radius:4px;border-left:2px solid var(--border)}
.log-entry.active{color:var(--text);border-left-color:var(--blue);background:#0d1f38}
.bottom-bar{background:var(--panel);border-top:1px solid var(--border);padding:9px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.step-desc{flex:1;font-size:13px;color:var(--text)}
.result-tag{display:none;padding:4px 13px;border-radius:20px;font-size:13px;font-weight:700;flex-shrink:0}
.result-tag.show{display:flex;background:#0d2a16;border:1px solid var(--green);color:var(--green)}
.step-num{font-size:11px;color:var(--muted);flex-shrink:0;min-width:60px;text-align:right}
.controls{display:flex;gap:6px;flex-shrink:0}
.btn{padding:7px 15px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.primary{background:#1c3458;border-color:var(--blue);color:var(--blue)}.btn.playing{background:#3d2b00;border-color:var(--orange);color:var(--orange)}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Find Min in BST &nbsp;<span style="color:var(--muted);font-weight:400;font-size:12px">Day 15 Problem 4 — BST</span></h1>
    <p>Key insight: Minimum is always the leftmost node. Keep going left until no left child.</p>
  </div>
  <div class="ex-btns">
    <button class="ex-btn active" onclick="loadEx(0)">① BST [4,2,7,1,3]</button>
    <button class="ex-btn"        onclick="loadEx(1)">② BST [10,5,15,3,7]</button>
    <button class="ex-btn"        onclick="loadEx(2)">③ BST [8,4,12,2,6]</button>
  </div>
  <div class="kbd-hint"><kbd>←</kbd><kbd>→</kbd> step &nbsp;<kbd>Space</kbd> auto &nbsp;<kbd>R</kbd> reset</div>
</div>
<div class="main">
  <div class="code-panel" id="code-panel">
    <div style="padding:8px 12px 6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">Python</div>
    <div class="io-bar input" id="code-input"></div>
    <div class="code-block" id="code-block"></div>
    <div class="io-bar output" id="code-output"><span class="io-lbl">OUT</span><span class="io-na">—</span></div>
  </div>
  <div class="resizer" id="resizer"></div>
  <div class="visual-panel">
    <div>
      <div class="panel-label">BST — purple=current · orange=visited · green=minimum found</div>
      <svg id="tree-svg" width="460" height="200" style="overflow:visible;display:block"></svg>
    </div>
    <div id="hint-box"></div>
  </div>
  <div class="state-panel">
    <div class="card">
      <div class="card-title">Variables</div>
      <div class="var-list" id="var-list"></div>
    </div>
    <div class="card card-grow">
      <div class="card-title">Step Log</div>
      <div class="log-list" id="log-list"></div>
    </div>
  </div>
</div>
<div class="bottom-bar">
  <div class="step-desc" id="step-desc">Pick an example, then click <strong>Next Step ▶</strong></div>
  <div class="result-tag" id="result-tag"></div>
  <div class="step-num" id="step-num">— / —</div>
  <div class="controls">
    <button class="btn" id="btn-prev" onclick="go(-1)" disabled>◀ Prev</button>
    <button class="btn primary" id="btn-next" onclick="go(+1)">Next Step ▶</button>
    <button class="btn" id="btn-auto" onclick="toggleAuto()">▶▶ Auto</button>
    <button class="btn" onclick="reset()">↺ Reset</button>
  </div>
</div>
<script>
const EX=[
  {arr:[4,2,7,1,3,null,null], pos:{0:{x:220,y:40},1:{x:120,y:100},2:{x:320,y:100},3:{x:60,y:160},4:{x:180,y:160}}, edges:[[0,1],[0,2],[1,3],[1,4]], min:1},
  {arr:[10,5,15,3,7,null,null], pos:{0:{x:220,y:40},1:{x:120,y:100},2:{x:320,y:100},3:{x:60,y:160},4:{x:180,y:160}}, edges:[[0,1],[0,2],[1,3],[1,4]], min:3},
  {arr:[8,4,12,2,6,null,null], pos:{0:{x:220,y:40},1:{x:120,y:100},2:{x:320,y:100},3:{x:60,y:160},4:{x:180,y:160}}, edges:[[0,1],[0,2],[1,3],[1,4]], min:2},
];

function simulate(ex){
  const {arr,edges}=ex;
  const steps=[];
  const visited=[];
  // iterative: go left
  let cur=0;
  while(true){
    const left=2*cur+1;
    const hasLeft=left<arr.length&&arr[left]!==null&&arr[left]!==undefined;
    if(!hasLeft){
      visited.push(cur);
      steps.push({cur,visited:[...visited],phase:'found',result:arr[cur],log:`node=${arr[cur]} has no left child → minimum is ${arr[cur]}`});
      break;
    }
    visited.push(cur);
    steps.push({cur,visited:[...visited],phase:'go_left',log:`node=${arr[cur]} has left child → go left`});
    cur=left;
  }
  steps.push({cur,visited:[...visited],phase:'done',result:arr[cur],log:`return ${arr[cur]}`});
  return steps;
}

const CODE=[
  `<span class="kw">def</span> <span class="fn">find_min_bst</span>(root):`,
  `    <span class="kw">if not</span> root: <span class="kw">return None</span>`,
  `    <span class="cm"># Keep going left</span>`,
  `    <span class="kw">while</span> root.left:`,
  `        root = root.left`,
  `    <span class="kw">return</span> root.val`,
];

function drawTree(ex,step){
  const {arr,pos,edges}=ex;
  const visited=step?new Set(step.visited):new Set();
  const cur=step?step.cur:-1;const ph=step?step.phase:'';
  let html='';
  edges.forEach(([p,c])=>{if(pos[p]&&pos[c]) html+=`<line x1="${pos[p].x}" y1="${pos[p].y}" x2="${pos[c].x}" y2="${pos[c].y}" stroke="#30363d" stroke-width="1.5"/>`;});
  for(let i=0;i<arr.length;i++){
    if(arr[i]===null||arr[i]===undefined||!pos[i]) continue;
    const isCur=i===cur;const isVis=visited.has(i)&&!isCur;const isFound=isCur&&(ph==='found'||ph==='done');
    const fill=isFound?'#0d2a16':isCur?'#2d1f69':isVis?'#2a1800':'#21262d';
    const stroke=isFound?'#3fb950':isCur?'#bc8cff':isVis?'#d29922':'#30363d';
    const tc=isFound?'#3fb950':isCur?'#d2b8ff':isVis?'var(--orange)':'#c9d1d9';
    html+=`<circle cx="${pos[i].x}" cy="${pos[i].y}" r="20" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    html+=`<text x="${pos[i].x}" y="${pos[i].y+5}" text-anchor="middle" font-family="'SF Mono',monospace" font-size="14" font-weight="700" fill="${tc}">${arr[i]}</text>`;
  }
  document.getElementById('tree-svg').innerHTML=html;
}

let exIdx=0,steps=[],stepIdx=-1,autoTmr=null;
function render(){
  const step=stepIdx>=0?steps[stepIdx]:null;
  const ex=EX[exIdx];
  drawTree(ex,step);
  const ph=step?step.phase:'';
  const hl={go_left:{3:'hl-orange',4:'hl-orange'},found:{3:'hl-green',5:'hl-green'},done:{5:'hl-green'}}[ph]||{};
  document.getElementById('code-block').innerHTML=CODE.map((l,i)=>`<div class="code-line${hl[i]?' '+hl[i]:''}""><span class="ln">${i+1}</span><span class="lt">${l}</span></div>`).join('');
  document.getElementById('code-input').innerHTML=`<span class="io-lbl">IN</span><span class="io-key">root</span><span class="io-sep">=</span><span class="io-v">[${ex.arr.filter(v=>v!==null).join(',')}]</span>`;
  const co=document.getElementById('code-output');
  if(step&&step.result!==undefined) co.innerHTML=`<span class="io-lbl">OUT</span><span class="io-v" style="color:var(--green)">${step.result}</span>`;
  else co.innerHTML=`<span class="io-lbl">OUT</span><span class="io-na">—</span>`;
  const vl=document.getElementById('var-list');
  if(step){const cur=step.cur;vl.innerHTML=`<div class="var-row"><span class="var-name">current</span><span class="var-eq">=</span><span class="var-val">${ex.arr[cur]}</span></div>`;}else vl.innerHTML='';
  const hint=document.getElementById('hint-box');
  hint.innerHTML=`<div class="hint-box">Key insight: In a BST, the <strong style="color:var(--green)">minimum</strong> is the <strong style="color:var(--orange)">leftmost</strong> node. No left subtree means this is the smallest value.</div>`;
  const ll=document.getElementById('log-list');
  if(step){const idx=steps.indexOf(step);ll.innerHTML=steps.slice(0,idx+1).map((s,i)=>`<div class="log-entry${i===idx?' active':''}">${s.log}</div>`).join('');ll.lastElementChild?.scrollIntoView({block:'nearest'});}else ll.innerHTML='';
  const rt=document.getElementById('result-tag');
  if(step&&step.phase==='done'){rt.className='result-tag show';rt.textContent='min = '+step.result;}else rt.className='result-tag';
  document.getElementById('step-desc').innerHTML=step?step.log:`Pick an example, then click <strong>Next Step ▶</strong>`;
  document.getElementById('step-num').textContent=stepIdx>=0?`${stepIdx+1} / ${steps.length}`:'— / —';
  document.getElementById('btn-prev').disabled=stepIdx<=0;
  document.getElementById('btn-next').disabled=stepIdx>=steps.length-1;
}
function loadEx(i){stopAuto();exIdx=i;steps=simulate(EX[i]);stepIdx=-1;document.querySelectorAll('.ex-btn').forEach((b,j)=>b.classList.toggle('active',j===i));render();}
function go(d){stepIdx=Math.max(-1,Math.min(steps.length-1,stepIdx+d));render();if(stepIdx>=steps.length-1) stopAuto();}
function stopAuto(){if(autoTmr){clearInterval(autoTmr);autoTmr=null;document.getElementById('btn-auto').classList.remove('playing');document.getElementById('btn-auto').textContent='▶▶ Auto';}}
function toggleAuto(){if(autoTmr)stopAuto();else{document.getElementById('btn-auto').classList.add('playing');document.getElementById('btn-auto').textContent='⏸ Pause';autoTmr=setInterval(()=>{if(stepIdx<steps.length-1)go(1);else stopAuto();},700);}}
function reset(){stopAuto();stepIdx=-1;render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key===' '){e.preventDefault();toggleAuto();}else if(e.key==='r'||e.key==='R')reset();});
(function(){const r=document.getElementById('resizer'),cp=document.getElementById('code-panel');let sx,sw;r.addEventListener('mousedown',e=>{sx=e.clientX;sw=cp.offsetWidth;document.body.style.cursor='col-resize';document.body.style.userSelect='none';const mv=e=>{cp.style.width=Math.max(120,sw+(e.clientX-sx))+'px';};const up=()=>{document.body.style.cursor='';document.body.style.userSelect='';document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});})();
loadEx(0);
</script>
<script src="../../visualize/problem_panel.js"></script>
</body>
</html>
